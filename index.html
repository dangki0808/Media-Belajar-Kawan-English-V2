<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kawan English</title>
<meta name="description" content="Kawan English: kursus bersertifikat, latihan bicara roleplay dengan suara, latihan 4 skill, dan les dengan tutor, dengan penjelasan bahasa Indonesia.">
<meta name="theme-color" content="#5b3df5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14324f; --ink2:#3d5671; --muted:#6f8094; --bg:#f6f1e8; --card:#fffdf9; --line:#e6ddcf;
  --read:#0f8a7e; --listen:#d98a10; --speak:#e2553f; --write:#6b4fc8; --vocab:#2a6fdb; --ok:#1f9d55; --bad:#d64545;
  --radius:18px; --shadow:0 1px 0 rgba(20,50,79,.06),0 6px 20px -10px rgba(20,50,79,.25);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
.serif{font-family:"Fraunces",Georgia,serif;letter-spacing:-.01em}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(var(--sat) + 0px) 0 calc(84px + var(--sab))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 14px) 18px 12px}
header.top .back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:20px}
header.top h1{font-size:20px;font-weight:800;flex:1}
header.top .pill{font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:99px;white-space:nowrap}
main{padding:4px 18px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.hero{background:var(--ink);color:#fff;border:none;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#f4b942 0,#f4b942 45%,transparent 46%);opacity:.95}
.hero.noorb:after{display:none}
.hero:before{content:"";position:absolute;right:40px;bottom:-60px;width:120px;height:120px;border-radius:50%;border:18px solid rgba(255,255,255,.08)}
.hero .k{font-size:13px;opacity:.75;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.hero h2{font-size:28px;margin:6px 0 4px;position:relative;z-index:1;max-width:75%}
.hero p{margin:0;opacity:.85;font-size:14px;position:relative;z-index:1;max-width:80%}
.stats{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;font-size:13px}
.stat b{display:block;font-size:18px}
.levels{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -18px 6px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.levels::-webkit-scrollbar{display:none}
.lv{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;text-align:left}
.lv b{display:block;font-size:16px}.lv span{font-size:12px;color:var(--muted)}
.lv.on{background:var(--ink);border-color:var(--ink);color:#fff}.lv.on span{color:#cfe0f0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{border:none;border-radius:var(--radius);padding:16px;text-align:left;color:#fff;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .ic{font-size:28px;line-height:1}
.tile b{font-size:17px;display:block}.tile small{opacity:.85;font-size:12px}
.tile .bar{display:block;height:5px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:8px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:#fff;border-radius:9px}
.t-read{background:var(--read)}.t-listen{background:var(--listen)}.t-speak{background:var(--speak)}.t-write{background:var(--write)}
.row{display:flex;align-items:center;gap:12px}
.list-btn{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;margin-bottom:10px;box-shadow:var(--shadow)}
.list-btn .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:0 0 auto;background:#eef3f8}
.list-btn b{display:block}.list-btn small{color:var(--muted)}
.list-btn .chev{margin-left:auto;color:var(--muted);font-size:20px}
.done-dot{width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;margin-left:auto}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#eef3f8;color:var(--ink2)}
.btn{border:none;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:#eef3f8;color:var(--ink)}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
.passage{font-size:18px;line-height:1.75}
.passage .w{border-radius:4px}
.passage .w:active{background:#f4e3c0}
.passage .gl{background:none;border:none;padding:0;font:inherit;color:var(--read);font-weight:700;text-decoration:underline dotted;text-underline-offset:4px}
.q{margin-top:16px}
.q p{font-weight:700;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.opt.right{border-color:var(--ok);background:#e8f6ee}
.opt.wrong{border-color:var(--bad);background:#fbeaea}
.fb{border-radius:12px;padding:12px 14px;margin-top:8px;font-size:14px}
.fb.ok{background:#e8f6ee;color:#155f37}.fb.no{background:#fbeaea;color:#8c2727}.fb.info{background:#eef3f8;color:var(--ink2)}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;background:#fff;color:var(--ink);resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--ink2)}
.big-play{width:96px;height:96px;border-radius:50%;border:none;background:var(--listen);color:#fff;font-size:38px;display:grid;place-items:center;margin:8px auto;box-shadow:0 10px 24px -10px var(--listen)}
.mic{width:96px;height:96px;border-radius:50%;border:none;background:var(--speak);color:#fff;font-size:38px;display:grid;place-items:center;margin:8px auto;box-shadow:0 10px 24px -10px var(--speak)}
.mic.rec{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,85,63,.5)}70%{box-shadow:0 0 0 22px rgba(226,85,63,0)}100%{box-shadow:0 0 0 0 rgba(226,85,63,0)}}
.center{text-align:center}
.rates{display:flex;gap:6px;justify-content:center;margin:6px 0}
.rates button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.rates button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.words{font-size:20px;line-height:1.8}
.words .hit{color:var(--ok);font-weight:700}.words .miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:5px}
.score{font-size:44px;font-weight:800}
.prog{height:8px;background:#e9e2d5;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:1.5px dashed var(--line);border-radius:14px;background:#fff}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:600}
.chip.used{visibility:hidden}
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.flash .word{font-size:38px}
.flash .mean{font-size:20px;font-weight:700;color:var(--vocab);margin-top:10px}
.flash .ex{color:var(--muted);margin-top:6px;font-style:italic}
.sheet-bg{position:fixed;inset:0;background:rgba(10,25,40,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 20px calc(24px + var(--sab));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,253,249,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--sab))}
nav.bottom .in{max-width:560px;margin:0 auto;display:flex}
nav.bottom button{flex:1;background:none;border:none;padding:6px 2px;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button span{font-size:22px;line-height:1}
nav.bottom button.on{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;box-shadow:var(--shadow);animation:up .2s}
.muted{color:var(--muted)}.small{font-size:13px}
.issue{border-left:4px solid var(--write);background:#f3f0fb;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.issue b{color:var(--write)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
ol.steps{padding-left:20px;margin:8px 0}ol.steps li{margin-bottom:8px}
.sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:18px 0 10px}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:0 18px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .ccard{flex:0 0 78%;scroll-snap-align:start}
.ccard{width:100%;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;padding:0;margin-bottom:12px;box-shadow:var(--shadow)}
.cband{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;color:#fff;font-size:28px}
.cband em{font-style:normal;font-size:12px;font-weight:800;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:99px}
.cbody{padding:12px 16px 16px;display:block}.cbody b{display:block;font-size:16px;line-height:1.3}.cbody small{display:block;color:var(--muted);margin-top:4px;font-size:13px}
.cmeta{display:block;font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.mini button{border:none;border-radius:14px;color:#fff;padding:12px 6px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mini button span{font-size:22px}
.banner{border-radius:var(--radius);color:#fff;padding:22px 20px;margin-bottom:14px;position:relative;overflow:hidden}
.banner .bic{font-size:40px}.banner h2{font-size:25px;margin:8px 0 6px}.banner p{margin:0;opacity:.9;font-size:14px}
.bmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.bmeta span{background:rgba(255,255,255,.2);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}
.learn{display:flex;gap:8px;margin:6px 0;font-size:14px}.learn:first-letter{color:var(--ok)}
details.mod{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
details.mod summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
details.mod summary::-webkit-details-marker{display:none}
details.mod summary b{display:block}details.mod summary small{color:var(--muted);font-size:12px}
.mnum{width:34px;height:34px;border-radius:10px;color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.item{width:100%;display:flex;gap:10px;align-items:center;background:none;border:none;border-top:1px solid var(--line);padding:12px 14px;text-align:left;font-size:14px}
.item small{color:var(--muted)}
.lp{margin:0 0 12px}
.rule{white-space:pre-wrap;background:#14324f;color:#fff;border-radius:12px;padding:12px 14px;margin:0 0 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.6}
.tipbox{background:#fff6e3;border-left:4px solid #f4b942;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.exs{margin:0 0 12px}.exr{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}.exr:last-child{border-bottom:none}
.spk{flex:0 0 auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#eef3f8;font-size:16px}
.mic2{background:#fdeceb}.mic2.rec{animation:pulse 1.2s infinite}
.opt.sel{border-color:var(--ink);background:#eef3f8}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.badge span{font-size:30px;display:block}.badge b{display:block;font-size:14px}.badge small{color:var(--muted);font-size:12px}
.badge.off{opacity:.42;filter:grayscale(1)}
.wbox{background:#f6f3fc;border:1px solid #e4dcf7;border-radius:14px;padding:14px;margin:0 0 12px}

/* ==== Jalur level & tutor (digabung dari v2) ==== */
/* ---- Kursus ---- */
.lcard{width:100%;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:0;text-align:left;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.lban{display:flex;justify-content:space-between;align-items:flex-start;height:78px;padding:12px 14px;color:#fff;position:relative;overflow:hidden}
.lban:after{content:"";position:absolute;right:-30px;bottom:-50px;width:120px;height:120px;border-radius:50%;border:16px solid rgba(255,255,255,.15)}
.lban.lv-A1{background:var(--read)}.lban.lv-A2{background:var(--vocab)}.lban.lv-B1{background:var(--write)}.lban.lv-B2{background:var(--speak)}.lban.lv-C1{background:var(--ink)}
.lbadge{font-weight:800;font-size:22px;background:rgba(255,255,255,.18);border-radius:10px;padding:2px 10px}
.lico{font-size:30px;position:relative;z-index:1}
.lbody{display:flex;flex-direction:column;gap:3px;padding:14px}
.lbody .ctitle{font-size:18px}
.lmeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2);font-weight:600;margin-top:4px}
.path{display:flex;align-items:center;margin-top:16px;position:relative;z-index:1}
.pnode{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);flex:0 0 auto}
.pnode.on{background:#f4b942;color:var(--ink);border-color:#f4b942}.pnode.ok{background:var(--ok);border-color:var(--ok)}
.pline{flex:1;height:2px;background:rgba(255,255,255,.3)}
.llearn{margin:8px 0 0;padding-left:0;list-style:none}.llearn li{padding-left:26px;position:relative;margin-bottom:8px}.llearn li:before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:800}
.modh{width:100%;display:flex;align-items:center;gap:12px;background:none;border:none;padding:14px;text-align:left}
.modh .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#eef3f8;flex:0 0 auto}
.modb{padding:0 14px 12px;border-top:1px solid var(--line);padding-top:12px}
.lesson{width:100%;display:flex;align-items:center;gap:12px;background:none;border:none;border-radius:10px;padding:9px 6px;text-align:left}
.lesson:hover:not(:disabled){background:#f4efe6}.lesson:disabled{opacity:.6;cursor:default}
.lchk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:12px;color:#fff}
.lchk.ok{background:var(--ok);border-color:var(--ok)}
.ltitle{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.promo{border:1px solid var(--line);background:#fbf0d6;border-radius:var(--radius);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.promo.p2{background:#e3f3f1}.promo small{color:var(--ink2);font-size:12px}
/* ---- Tutor ---- */
.ava{border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto;letter-spacing:.02em}
.tcard{cursor:pointer}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.fav{background:none;border:none;font-size:24px;line-height:1;color:var(--muted);padding:2px 4px}.fav.on{color:var(--bad)}
.fchip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:700}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
select{border:1.5px solid var(--line);border-radius:99px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;background:var(--card);color:var(--ink)}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tstats div{background:#f4efe6;border-radius:12px;padding:10px;text-align:center}.tstats b{display:block}.tstats span{font-size:11px;color:var(--muted)}
.dchip[data-empty]{opacity:.5}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slot{border:1.5px solid var(--ink);background:var(--card);border-radius:12px;padding:10px 0;font-weight:700}
.slot:hover:not(:disabled){background:var(--ink);color:#fff}
.slot:disabled{border-color:var(--line);color:var(--muted);background:#f1ece3;text-decoration:line-through;cursor:default}
.stars{color:#e3a008;letter-spacing:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px;font-size:13px;text-align:center}
.seg button.on{border-color:var(--ink);background:#eef3f8;box-shadow:inset 0 0 0 1px var(--ink)}
.when{font-weight:700;margin:10px 0 4px}
.rstars{display:flex;gap:6px;justify-content:center;margin:12px 0}
.rstars button{border:none;background:none;font-size:36px;color:#d9d2c4;padding:0}.rstars button.on{color:#e3a008}
.sheet{max-height:90vh;overflow-y:auto}
nav.bottom button{font-size:10.5px}
.hscroll .lcard{flex:0 0 78%;scroll-snap-align:start}
.lmod{padding:0}

/* =====================================================================
   TEMA v3 — bersih & terang ala platform kursus modern
   (putih, aksen ungu, kartu lembut, status pill, sidebar di desktop)
   ===================================================================== */
:root{
  --accent:#5b3df5; --accent2:#7c62ff; --accentSoft:#efebff; --accentInk:#3a22c9;
  --ink:#1b1740; --ink2:#4a4568; --muted:#78739a; --bg:#f7f6fc; --card:#ffffff; --line:#e9e6f5;
  --radius:16px; --shadow:0 1px 2px rgba(27,23,64,.04),0 10px 28px -16px rgba(27,23,64,.18);
  --side:248px;
}
html,body{background:var(--bg);color:var(--ink)}
.serif{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}
h1,h2,h3{text-wrap:balance}
header.top{background:rgba(247,246,252,.92);backdrop-filter:blur(10px);border-bottom:1px solid transparent}
header.top h1{font-size:19px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .pill{background:var(--card);border-color:var(--line);color:var(--ink2)}
header.top .back{background:var(--card);border-color:var(--line)}
.avatar{width:38px;height:38px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;flex:0 0 auto}
.card{border-color:var(--line);box-shadow:var(--shadow)}
.hero{background:var(--accent);color:#fff}
.hero:after{background:radial-gradient(circle,rgba(255,255,255,.16) 0,rgba(255,255,255,.16) 45%,transparent 46%)}
.hero:before{border-color:rgba(255,255,255,.10)}
.hero .stat{background:rgba(255,255,255,.16)}
.btn{background:var(--accent);border-radius:12px}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--accentSoft);color:var(--accentInk)}
.btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list-btn{border-color:var(--line)}
.list-btn .ic{background:var(--accentSoft)}
.tag{background:var(--accentSoft);color:var(--accentInk)}
.lv.on,.fchip.on{background:var(--accent);border-color:var(--accent)}
.prog{background:#ebe8f6}.prog i{background:var(--accent)}
.sec-title{color:var(--muted);letter-spacing:.09em}
.opt.sel{border-color:var(--accent);background:var(--accentSoft)}
.rates button.on{background:var(--accent);border-color:var(--accent)}
textarea:focus,input:focus{border-color:var(--accent)}
.fb.info{background:var(--accentSoft);color:var(--ink2)}
.rule{background:var(--ink)}
.toast{background:var(--ink)}
.slot{border-color:var(--accent)}.slot:hover:not(:disabled){background:var(--accent)}
.seg button.on{border-color:var(--accent);background:var(--accentSoft);box-shadow:inset 0 0 0 1px var(--accent)}
.status{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--accentSoft);color:var(--accentInk);white-space:nowrap;flex:0 0 auto}
.status.ok{background:#e4f6ec;color:#167a43}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:3px;vertical-align:1px}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:700;padding:4px 0}
.switch{width:50px;height:30px;border-radius:99px;border:none;background:#d9d5ea;position:relative;flex:0 0 auto;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.switch.on{background:var(--accent)}.switch.on i{left:23px}
/* nav */
nav.bottom{background:rgba(255,255,255,.96);border-top-color:var(--line)}
nav.bottom button.on{color:var(--accent)}
nav.bottom .brand{display:none}
.desk-only{display:none!important}
/* Tanya Kawan */
.fab{position:fixed;right:16px;bottom:calc(86px + var(--sab));z-index:7;border:none;border-radius:99px;background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:11px 15px;box-shadow:0 10px 24px -8px rgba(27,23,64,.5)}
.fab span{display:none}
/* Teman Bicara */
.scgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:6px}
.sccard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:0}
.sccard.spot{margin-bottom:14px}
.scic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:0 0 auto;color:#fff}
.topicgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.topic{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.topic span{font-size:24px}.topic b{font-size:14px;line-height:1.3}.topic small{color:var(--muted);font-size:12px}
.topic:hover,.sccard:hover,.ccard:hover,.lcard:hover{border-color:#cfc6fb}
.chathead{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.msg{display:flex;flex-direction:column;max-width:88%}
.msg.bot{align-self:flex-start}.msg.me{align-self:flex-end;align-items:flex-end}.msg.sys{align-self:center}
.msg .bub{padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.5}
.msg.bot .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me .bub{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg .tr{color:var(--muted);font-size:13px;margin-top:4px;font-style:italic}
.mact{display:flex;gap:6px;margin-top:8px}
.mact button,.minispk{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;color:var(--ink2)}
.fbk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:13px;margin-top:6px;max-width:100%;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.fbk .iss{color:#6a3bb5}
.tagok,.tagmid{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px}
.tagok{background:#e4f6ec;color:#167a43}.tagmid{background:#fff3dc;color:#9a6200}
#composer{position:sticky;bottom:calc(72px + var(--sab));background:linear-gradient(to bottom,rgba(247,246,252,0),var(--bg) 18px);padding-top:16px;z-index:3}
.compose{display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:6px}
.compose:focus-within{border-color:var(--accent)}
.compose input{border:none;flex:1;min-width:0;padding:10px 6px;background:transparent}
.compose input:focus{outline:none}
.micbtn,.sendbtn{width:44px;height:44px;border-radius:12px;border:none;display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.micbtn{background:var(--accentSoft)}.micbtn.rec{background:#fde3df;animation:pulse 1.2s infinite}
.sendbtn{background:var(--accent);color:#fff}
.hints{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.hint{border:1px solid #d8d0fb;background:var(--accentSoft);color:var(--accentInk);border-radius:12px;padding:7px 11px;font-size:13px;font-weight:600;text-align:left}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kpis div{background:var(--bg);border-radius:12px;padding:10px}.kpis b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.kpis span{font-size:11px;color:var(--muted)}
.kres{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
/* ============ desktop: sidebar + konten lebar ============ */
@media (min-width:960px){
  #app{max-width:none;margin:0 0 0 var(--side);padding-bottom:32px}
  header.top{padding:18px 40px 14px;max-width:1120px;margin:0 auto}
  main{max-width:1120px;margin:0 auto;padding:6px 40px 40px}
  nav.bottom{top:0;bottom:0;left:0;right:auto;width:var(--side);border-top:none;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px;backdrop-filter:none}
  nav.bottom .brand{display:flex;align-items:center;gap:10px;padding:0 10px;font-size:17px}
  nav.bottom .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
  nav.bottom .in{flex-direction:column;gap:4px;max-width:none;margin:0}
  nav.bottom button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:11px 12px;border-radius:12px;color:var(--ink2)}
  nav.bottom button span{font-size:19px}
  nav.bottom button:hover{background:var(--bg)}
  nav.bottom button.on{background:var(--accentSoft);color:var(--accentInk)}
  .desk-only{display:flex!important}
  .fab{bottom:28px;right:28px}.fab span{display:inline}
  .toast{bottom:32px;left:calc(50% + var(--side) / 2)}
  .scgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .topicgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:start}
  #list>.hero,#list>.sec-title,#list>.hscroll,#list>.card{grid-column:1/-1}
  #list .ccard,#list .lcard{margin-bottom:0}
  #tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;align-items:start}
  #tlist .card{margin-bottom:0}
  .grid{grid-template-columns:repeat(4,1fr)}
  .mini{grid-template-columns:repeat(5,1fr)}
  .hscroll .ccard,.hscroll .lcard{flex:0 0 300px}
  #composer{bottom:0}
  .chat .msg{max-width:70%}
  .sheet-bg{align-items:center}.sheet{border-radius:20px}
}

/* =====================================================================
   TEMA v4 — dasbor kursus ala Coursebox: gradien ungu-biru, kartu media
   bergambar, status pill, KPI, segmen jenjang
   ===================================================================== */
:root{--grad:linear-gradient(135deg,#6d28d9 0%,#4f46e5 55%,#2563eb 100%)}
.hero{background:var(--grad)}
.hero .k{opacity:.8}
.btn{background:var(--grad);background-color:var(--accent)}
.btn.ghost,.btn.soft{background-image:none}
.cband{background-image:linear-gradient(135deg,rgba(255,255,255,.22),rgba(0,0,0,.06))}
.ccard{transition:transform .15s,box-shadow .15s}.ccard:hover{transform:translateY(-2px)}
.seg.jj{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg.jj button{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 8px;font-weight:800;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.seg.jj button small{font-weight:600;color:var(--muted);font-size:11px}
.seg.jj button.on{border-color:var(--accent);background:var(--accentSoft);color:var(--accentInk);box-shadow:inset 0 0 0 1px var(--accent)}
.vcard{flex:0 0 72%;scroll-snap-align:start;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:0;overflow:hidden;text-align:left;box-shadow:var(--shadow);transition:transform .15s}
.vcard:hover{transform:translateY(-2px);border-color:#cfc6fb}
.vthumb{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;background-image:linear-gradient(135deg,rgba(255,255,255,.25),rgba(0,0,0,.1))}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--accentInk);display:grid;place-items:center;font-size:17px;box-shadow:0 6px 18px -6px rgba(0,0,0,.4);padding-left:3px}
.vdone{position:absolute;left:8px;top:8px;background:#16a34a;color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px}
.vbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}.vbody b{font-size:14px;line-height:1.35}.vbody small{color:var(--muted);font-size:12px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vgrid .vcard{flex:none}
.vmore{flex:0 0 40%;border:1.5px dashed var(--line);border-radius:var(--radius);background:transparent;color:var(--accent);font-weight:800}
.vinline{width:100%;display:flex;gap:12px;align-items:center;background:var(--accentSoft);border:1px solid #ddd5fd;border-radius:14px;padding:8px;margin:0 0 12px}
.vthumb.sm{flex:0 0 112px;border-radius:10px;background-color:var(--accent)}
.vthumb.sm .vplay{width:32px;height:32px;font-size:12px}
.player{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:#0f0b2a;box-shadow:var(--shadow)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
a.list-btn{text-decoration:none;color:inherit}
.aicard{background:var(--card);border-radius:var(--radius);padding:16px;margin:0 0 14px;border:1.5px solid transparent;background-image:linear-gradient(var(--card),var(--card)),var(--grad);background-origin:border-box;background-clip:padding-box,border-box;box-shadow:var(--shadow)}
.typing{display:flex;gap:4px;align-items:center;min-width:52px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@media (min-width:960px){
  .hscroll .vcard{flex:0 0 260px}
  .vgrid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .seg.jj{grid-template-columns:repeat(5,1fr)}
  .player{max-width:900px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
